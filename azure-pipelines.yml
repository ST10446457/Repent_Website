trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:
- checkout: self
  displayName: 'Checkout REPENT website'

- bash: |
    set -euo pipefail
    php --version
    find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -r -n1 php -l
  displayName: 'Validate PHP syntax across website'

- bash: |
    set -euo pipefail
    php tests/auth_smoke.php
  displayName: 'Run authentication unit checks'

- task: ArchiveFiles@2
  displayName: 'Package website'
  inputs:
    rootFolderOrFile: '$(Build.SourcesDirectory)'
    includeRootFolder: false
    archiveType: zip
    archiveFile: '$(Build.ArtifactStagingDirectory)/repent-website.zip'
    replaceExistingArchive: true

- task: PublishPipelineArtifact@1
  displayName: 'Publish website artifact'
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)/repent-website.zip'
    artifact: 'REPENT-website'
